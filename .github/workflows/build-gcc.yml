name: Build GCC

on:
  push:
    paths:
      - ".github/workflows/build-gcc.yml"
      - ".gitmodules"
      - "gcc"
      - "release.toml"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            package_arch: x86_64
          - runner: ubuntu-24.04-arm
            package_arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE_ARCH: ${{ matrix.package_arch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          submodules: recursive

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gnat \
            gfortran \
            flex \
            bison \
            texinfo \
            libgmp-dev \
            libmpfr-dev \
            libmpc-dev \
            libisl-dev \
            zlib1g-dev \
            libzstd-dev \
            python3 \
            xz-utils \
            wget \
            ca-certificates

      - name: Verify bootstrap compilers
        run: |
          gnat --version
          gnatmake --version
          gnatbind --version
          gfortran --version

      - name: Load release metadata
        run: python3 ./scripts/release_metadata.py --format github-env --repo-slug "${GITHUB_REPOSITORY}" >> "${GITHUB_ENV}"

      - name: Build GCC
        run: ./scripts/build_gcc.sh --jobs "$(nproc)" --source-dir ./gcc --work-dir ./build --stage-dir ./stage

      - name: Smoke test staged compiler
        run: ./scripts/smoke_test.sh --stage-dir ./stage

      - name: Package staged compiler
        run: ./scripts/package_release.sh --stage-dir ./stage --output-dir ./dist

      - name: Upload packaged compiler
        uses: actions/upload-artifact@v4
        with:
          name: gcc-${{ matrix.package_arch }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          submodules: recursive

      - name: Setup Alire for index validation
        uses: alire-project/setup-alire@v5
        with:
          version: 2.1.0

      - name: Load release metadata
        run: python3 ./scripts/release_metadata.py --format github-env --repo-slug "${GITHUB_REPOSITORY}" >> "${GITHUB_ENV}"

      - name: Download packaged compilers
        uses: actions/download-artifact@v5
        with:
          pattern: gcc-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Generate index manifest
        run: |
          python3 ./scripts/generate_index.py \
            --repo-slug "${GITHUB_REPOSITORY}" \
            --sha256-file "x86_64=./dist/gnat-x86_64-linux-${CRATE_VERSION}.tar.gz.sha256" \
            --sha256-file "aarch64=./dist/gnat-aarch64-linux-${CRATE_VERSION}.tar.gz.sha256"

      - name: Validate private index with Alire
        run: |
          alr index --add="${PWD}" --name=prunt_ci
          alr index --update-all
          alr show "gnat_native=${CRATE_VERSION}"
          alr index --del=prunt_ci || true

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 || \
          gh release create "${RELEASE_TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_NAME}" \
            --notes "Built from Prunt3D/gcc commit ${GCC_COMMIT}"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" ./dist/*.tar.gz ./dist/*.tar.gz.sha256 --clobber

      - name: Publish index branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./scripts/export_index_branch.sh --branch "${INDEX_BRANCH}" --push
