name = "gnat_native"
version = "16.2.1005"
provides = ["gnat=16.2.1005"]
description = "GCC with C, Ada, and Fortran enabled, plus backports"
website = "https://github.com/Prunt3D/gcc"
maintainers = ["Liam Powell <liam@liampwll.com>"]
maintainers-logins = ["liampwll"]
licenses = "GPL-3.0-or-later AND GPL-3.0-or-later WITH GCC-exception-3.1"
auto-gpr-with = false
notes = "Built from GCC 16.2.1005 commit 2a577ea94a73feecb52a50a566a3285b3864b693"

[configuration]
disabled = true

[environment."case(os)".linux]
PATH.prepend = "${CRATE_ROOT}/local/bin"
LIBRARY_PATH.prepend = "${CRATE_ROOT}/local/lib64"
LD_LIBRARY_PATH.prepend = "${CRATE_ROOT}/local/lib64"
LD_RUN_PATH.prepend = "${CRATE_ROOT}/local/lib64"


[origin."case(os)".linux."case(host-arch)".x86-64]
binary = true
url = "https://github.com/Prunt3D/prunt_alire_index/releases/download/gnat-16.2.1005/gnat-x86_64-linux-16.2.1005.tar.gz"
hashes = ["sha256:b95b9bfdf2e6d1750d5e98bff85e24de55d788e88bc91c880537cff4c54995f1"]


[origin."case(os)".linux."case(host-arch)".aarch64]
