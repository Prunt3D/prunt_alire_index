# The major and minor versions are those of the GCC whose front end gnat2why contains and whose compiler the
# archive bundles (gnat_native in alire.toml). The patch version counts Prunt releases in that series from 1001:
# increment it for every published change, including compiler, spark2014 and base release updates.
crate_version = "16.2.1001"

# The released GNATprove whose driver, Why3, provers and SPARKlib are repackaged. gnat2why is rebuilt from the
# spark2014 submodule, which must be the source of this release apart from Prunt's changes.
[base]
version = "16.1.0-1"

[base.x86_64]
url = "https://github.com/alire-project/GNAT-FSF-builds/releases/download/gnatprove-16.1.0-1/gnatprove-x86_64-linux-16.1.0-1.tar.gz"
sha256 = "82528bef29857e239373fcc36732837d743f5a00805d502c70455422ffc97191"

[base.aarch64]
url = "https://github.com/alire-project/GNAT-FSF-builds/releases/download/gnatprove-16.1.0-1/gnatprove-aarch64-linux-16.1.0-1.tar.gz"
sha256 = "ee22bf0d80f9a3bfbc1c2e6acb68102adb42dcf67d1b24693ad31cb791cbad52"

# COLIBRI, a prover which GNATprove supports but does not bundle. Its bundles contain the ECLiPSe Prolog system it
# runs on: v7 has the ECLiPSe of 2019 (7.0 build 45), v5 that of 2008. CEA publishes them for x86_64 Linux and
# Windows only, so the aarch64 archive has no COLIBRI.
[colibri]
version = "2026.06"
license = "LGPL-2.1-or-later"
source = "https://git.frama-c.com/pub/colibri/-/tree/2026.06"

[colibri.x86_64]
url = "https://git.frama-c.com/pub/colibri/-/releases/2026.06/downloads/bundle-v7"
# The same file, published by CEA for SMT-COMP (doi:10.5281/zenodo.20639619), in case git.frama-c.com's bot
# protection turns the download away.
mirror = "https://zenodo.org/api/records/20639619/files/colibri-2026.06-v7.tar.gz/content"
file = "colibri-2026.06-v7.tbz"
sha256 = "5113b32e5790a0d33219fd25bdb667a33a45fe5dbf3255151709a7bc805a6dc9"
