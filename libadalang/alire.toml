name = "libadalang_build"
description = "Build inputs for Prunt's precompiled static Libadalang bundle"
version = "0.0.0"
licenses = "MIT"
maintainers = ["Liam Powell <liam@liampwll.com>"]
maintainers-logins = ["liampwll"]
project-files = ["libadalang_build.gpr"]

[configuration]
disabled = true

[[depends-on]]
# Deliberately independent of ../release.toml: consume an already released GNAT.
# Keep this aligned with Prunt's config_codegen compiler.
gnat_native = "=16.2.1001"
gnat = "=16.2.1001"
gprbuild = "=25.0.1"
libadalang = "=26.0.0"
gnatcoll = "=26.0.0"
gnatcoll_minimal = "=26.0.0"
gnatcoll_projects = "=26.0.0"
gnatcoll_gmp = "=26.0.0"
gnatcoll_iconv = "=26.0.0"
libgpr = "=26.0.0"
libgpr2 = "=26.0.0"
langkit_support = "=26.0.0"
prettier_ada = "=26.0.0"
adasat = "=26.0.0"
xmlada = "=26.0.0"
vss_text = "=26.2.0"
gprconfig_kb = "=26.0.0"

[[pins]]
libgpr = { url = "https://github.com/Prunt3D/gprbuild.git", commit = "56139608315345ffe109bb98ecb3d3bfa27c036e" }
libgpr2 = { url = "https://github.com/Prunt3D/gpr.git", commit = "ae17b1b3ce7f8f17f11466a8b9b86c02cb9d6f20" }
langkit_support = { url = "https://github.com/Prunt3D/langkit_support.git", commit = "3fe0191dcbea529c52116afe510ad73fb0e395d7" }

[gpr-set-externals]
LIBRARY_TYPE = "static"
LIBADALANG_LIBRARY_TYPE = "static"
LANGKIT_SUPPORT_LIBRARY_TYPE = "static"
PRETTIER_ADA_LIBRARY_TYPE = "static"
VSS_LIBRARY_TYPE = "static"
